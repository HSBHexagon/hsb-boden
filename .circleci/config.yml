# Spiegelt .github/workflows/ci.yml (Job build-and-test) für die Website in apps/website.
# Siehe https://circleci.com/docs/reference/configuration-reference/
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - run:
          name: Check out exact commit over HTTPS
          environment:
            HSB_CHECKOUT_SHA: << pipeline.git.revision >>
            GIT_TERMINAL_PROMPT: "0"
          command: |
            set -euo pipefail
            if [[ ! "${HSB_CHECKOUT_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "CircleCI checkout revision is missing or invalid" >&2
              exit 1
            fi
            # The repository is public. Avoid the CircleCI SSH checkout key.
            git init --quiet
            git remote add origin https://github.com/HSBHexagon/hsb-boden.git
            git -c credential.helper= fetch --no-tags --depth=1 origin "$HSB_CHECKOUT_SHA"
            git checkout --quiet --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$HSB_CHECKOUT_SHA"
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "apps/website/package-lock.json" }}
            - v1-npm-
      - run:
          name: Install dependencies
          working_directory: ~/project/apps/website
          command: npm ci
      - save_cache:
          key: v1-npm-{{ checksum "apps/website/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck
          working_directory: ~/project/apps/website
          command: npm run check
      - run:
          name: Run tests
          working_directory: ~/project/apps/website
          command: npm run test:run
      - run:
          name: Build project
          working_directory: ~/project/apps/website
          command: npm run build

workflows:
  website:
    jobs:
      - build-and-test
