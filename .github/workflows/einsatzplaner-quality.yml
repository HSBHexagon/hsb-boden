name: Einsatzplaner Quality
on:
  pull_request:
    branches: [main]
    paths: ['apps/einsatzplaner/**', '.github/workflows/einsatzplaner-quality.yml']
  push:
    branches: ['feat/hexafloor-central-planner']
    paths: ['apps/einsatzplaner/**', '.github/workflows/einsatzplaner-quality.yml']
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/einsatzplaner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/einsatzplaner/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run deploy:dry-run
      - run: python3 ../../scripts/verify_ssot.py
