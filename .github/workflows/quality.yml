name: Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/website/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Verify canonical project constraints
        run: python3 scripts/verify_ssot.py

      - name: Check types
        run: npm run check
        
      - name: Build
        run: npm run build
        
      - name: Check built sitemap against published pages
        run: npm run check:sitemap

      - name: Run tests
        run: npm run test:run

      - name: Verify Pages deployment artifacts
        run: npm run deploy:dry-run
