name: Sales OS safety and inbound
on:
  pull_request:
    paths: ['apps/sales-os/**', '.github/workflows/sales-os-safety.yml']
  push:
    branches: ['fix/sales-os-completion-20261026']
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded operation; customer sending is always disabled
        type: choice
        options: [audit, draft-preview, inbound-preview, inbound-sync]
        default: audit
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: hsb-sales-os-runtime
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: pip install -r apps/sales-os/requirements.txt
      - run: python -m pytest apps/sales-os/tests/ -q
      - run: python scripts/verify_ssot.py
  live-readonly-and-inbound:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HSB_GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.HSB_SALES_GOOGLE_AUTH }}
      HSB_MAILBOX_CONFIG_JSON: ${{ secrets.HSB_SALES_MAILBOXES_JSON }}
      HSB_CUSTOMER_SEND_ENABLED: 'no'
      HSB_INTERNAL_TEST_SEND_ENABLED: 'no'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: pip install -r apps/sales-os/requirements.txt
      - name: Verify configured authentication without exposing secrets
        run: |
          python - <<'PY'
          import os
          assert os.environ.get('HSB_GOOGLE_AUTHORIZED_USER_JSON'), 'Missing CRM authentication'
          assert os.environ.get('HSB_MAILBOX_CONFIG_JSON'), 'Missing mailbox authentication'
          PY
      - name: Scheduled or explicitly selected .com reply synchronization
        if: github.event_name == 'schedule' || inputs.mode == 'inbound-sync'
        run: python apps/sales-os/engine/hsb_cli.py sync --com-only --apply
      - name: Preview .com reply synchronization
        if: inputs.mode == 'inbound-preview'
        run: python apps/sales-os/engine/hsb_cli.py sync --com-only
      - name: Full read-only reconciliation
        if: github.event_name == 'push' || inputs.mode == 'audit'
        run: python -u apps/sales-os/engine/sales_reconciliation.py --output "$RUNNER_TEMP/hsb-reconciliation"
      - name: Existing .com draft inventory and text sample
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'draft-preview'
        env:
          PYTHONPATH: apps/sales-os/engine
        run: |
          python -u - <<'PY'
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor
          from email import policy
          from email.parser import BytesParser
          import json
          import re
          from com_mailbox_manager import ComMailboxClient
          from draft_upgrade import _raw, _select
          from hsb_core import normalize_owner
          from outbound_safety import INTERNAL_RECIPIENTS
          from sales_reconciliation import SENDERS, addresses, assess_message
          from sync_to_google_sheet import get_sheets_service, SPREADSHEET_ID

          rows = get_sheets_service().spreadsheets().values().get(
              spreadsheetId=SPREADSHEET_ID, range='ALL_LEADS!A1:BU6425').execute()['values']
          leads = defaultdict(list)
          for row in rows[1:]:
              lead = dict(zip(rows[0], row))
              leads[str(lead.get('E-Mail') or '').strip().lower()].append(lead)
          lead_ids = Counter(lead.get('Lead-ID') for group in leads.values() for lead in group)

          def read(owner):
              client = ComMailboxClient(owner)
              folder = client.cfg['drafts_folder']
              result, matched, mids, candidates = Counter(), Counter(), Counter(), []
              templates, sample_issues = Counter(), Counter()
              with client._get_imap() as imap:
                  validity = _select(imap, folder)
                  def uids():
                      status, data = imap.uid('SEARCH', None, 'ALL')
                      if status != 'OK':
                          raise RuntimeError('DRAFT_SEARCH_FAILED')
                      return data[0].split() if data and data[0] else []
                  initial = uids()
                  result['folder_entries'] = len(initial)
                  result['uid_move_supported'] = int(b'MOVE' in imap.capabilities or 'MOVE' in imap.capabilities)
                  for start in range(0, len(initial), 100):
                      expected = set(initial[start:start + 100])
                      status, data = imap.uid('FETCH', b','.join(sorted(expected)),
                          '(UID BODY.PEEK[HEADER.FIELDS (FROM TO CC BCC REPLY-TO MESSAGE-ID X-HSB-LEAD-ID X-HSB-TEMPLATE-ID)])')
                      if status != 'OK':
                          raise RuntimeError('DRAFT_HEADER_FETCH_FAILED')
                      for part in data:
                          if not isinstance(part, tuple):
                              continue
                          uid = re.search(rb'\bUID (\d+)', part[0]).group(1)
                          expected.remove(uid)
                          msg = BytesParser(policy=policy.default).parsebytes(part[1])
                          recipients = addresses(msg.get('To'))
                          if recipients and all(addr in INTERNAL_RECIPIENTS for addr in recipients):
                              result['internal_tests'] += 1
                              continue
                          if len(recipients) != 1 or msg.get('Cc') or msg.get('Bcc'):
                              result['unmatched_headers'] += 1
                              continue
                          group = leads.get(recipients[0], [])
                          lid = str(group[0].get('Lead-ID') or '') if len(group) == 1 else ''
                          mid = str(msg.get('Message-ID') or '')
                          if mid:
                              mids[mid] += 1
                          if (not lid or lead_ids[lid] != 1 or not mid
                                  or normalize_owner(group[0].get('Verantwortlicher')) != owner
                                  or addresses(msg.get('From')) != [SENDERS[owner]]
                                  or str(msg.get('X-HSB-Lead-ID') or lid) != lid):
                              result['unmatched_headers'] += 1
                              continue
                          matched[lid] += 1
                          result['crm_matched_entries'] += 1
                          tid = str(msg.get('X-HSB-Template-ID') or '')
                          if re.fullmatch(r'v2-(architekten|produktion)-(?:reparatur-)?s[1-3]', tid):
                              templates[tid] += 1
                          if tid in ('v2-architekten-s1', 'v2-architekten-reparatur-s1'):
                              candidates.append((uid, recipients[0]))
                      if expected:
                          raise RuntimeError('DRAFT_HEADERS_INCOMPLETE')
                  for uid, recipient in sorted(candidates, key=lambda pair: int(pair[0]), reverse=True)[:30]:
                      report = assess_message(_raw(imap, uid.decode()), owner, leads[recipient])
                      sample_issues.update(report['issues'])
                      result['full_mime_sample'] += 1
                  if _select(imap, folder, validity) != validity or uids() != initial:
                      raise RuntimeError('DRAFT_FOLDER_CHANGED_DURING_SCAN')
              result['unique_crm_customer_drafts'] = sum(n == 1 for n in matched.values())
              result['duplicate_crm_leads'] = sum(n > 1 for n in matched.values())
              result['duplicate_message_ids'] = sum(n > 1 for n in mids.values())
              return dict(result, templates=templates, sample_issues=sample_issues)

          with ThreadPoolExecutor(max_workers=2) as pool:
              result = dict(zip(SENDERS, pool.map(read, SENDERS)))
          print(json.dumps({'drafts_only': result, 'customer_emails_sent': 0}, ensure_ascii=False))
          PY
      # Raw MIME, customer lists, queue and credentials are never uploaded.
